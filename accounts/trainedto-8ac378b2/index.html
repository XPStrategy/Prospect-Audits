<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>[AUDIT]-TrainedTo - XP Strategy</title>
<style>
:root { --dark:#111318; --ink:#1a1d24; --accent:#FF9900; --muted:#666666; --bg:#fafaf7; --border:#e6e4de; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Helvetica Neue',Arial,sans-serif; background:var(--bg); color:var(--ink); }
header { background:var(--dark); color:#fff; padding:28px 16px; }
.in { max-width:1080px; margin:0 auto; padding:0 24px; }
h1 { font-size:22px; font-weight:600; } .sub { opacity:.75; font-size:13px; margin-top:6px; }
.bar { position:sticky; top:0; background:#fff; border-bottom:3px solid var(--accent); z-index:10; }
.bar .in { display:flex; flex-wrap:wrap; gap:6px 8px; padding:10px 24px; align-items:center; }
.h { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; margin-right:4px; }
.h2 { margin-left:10px; padding-left:12px; border-left:1px solid var(--border); color:var(--muted); }
.lk { font-size:12px; font-weight:600; color:var(--dark); background:#fff7ea; border:1px solid var(--accent);
       border-radius:14px; padding:4px 11px; text-decoration:none; white-space:nowrap; }
a.lk:hover { background:var(--accent); color:#fff; }
.lk.t { background:#f3f4f6; border-color:#c9ccd2; }
.lk.off { color:#b5b5b5; background:#fafafa; border:1px dashed #d6d6d6; font-weight:500; }
.team { display:none; } body.is-team .team { display:inline-flex; flex-wrap:wrap; gap:6px 8px; }
main { padding:28px 0 60px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
.card { display:block; background:#fff; border:1px solid var(--border); border-left:4px solid var(--accent);
         border-radius:6px; padding:18px; text-decoration:none; color:var(--ink); }
.card:hover { box-shadow:0 4px 14px rgba(0,0,0,.08); }
.card b { display:block; font-size:16px; margin-bottom:6px; color:var(--dark); }
.card span { font-size:12.5px; color:var(--muted); }
.card.sheet { border-left-color:#5b8f5b; }
.meta { font-size:12px; color:var(--muted); margin-top:26px; }
@media (max-width:640px) { .in { padding:0 16px; } .bar .in { padding:8px 16px; } }
</style></head>
<body>
<header><div class="in"><h1>[AUDIT]-TrainedTo - XP Strategy</h1><div class="sub" id="sub"></div></div></header>
<div class="bar"><div class="in" id="bar"></div></div>

<script>
(function(){
  var M = JSON.parse(document.getElementById('seed').textContent);
  var team = /[?&]team=1/.test(location.search) || location.hash === '#team';
  if (team) document.body.classList.add('is-team');
  function e(t){ var d=document.createElement('div'); d.textContent=t||''; return d.innerHTML; }
  function q(team){ return team ? (location.search || '') : ''; }
  function render(){
    if (M.names && M.names.base) document.title = M.names.base;
    var h1 = document.querySelector('h1'); if (M.names && M.names.base) h1.textContent = M.names.base;
    document.getElementById('sub').textContent = (M.folder_name || '') + (M.updated ? '  ·  updated ' + M.updated.slice(0,10) : '');

      var url = i.key === 'account_sheet' ? (M.account_sheet || i.url) : i.url;
      var cls = 'lk' + (i.group === 'team' ? ' t' : '');

      if (i.group === 'team') t += s; else c += s;
    });

    var cards = '';

  }
  render();
  if (location.protocol.indexOf('http') === 0) {
    fetch('links.json', {cache:'no-store'}).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if (j) { M = Object.assign(M, j); render(); } }).catch(function(){});
  }
})();
</script>
